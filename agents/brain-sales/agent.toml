name = "brain-sales"
version = "0.1.0"
description = "Rights carrier (no agent): Sales (sales-claw): the Brain places orders of a fixed kind in the order book; the Sales agent takes them."
author = "vibemind"
module = "builtin:chat"
tags = ["vibemind", "brain-routed", "space:sales", "rights-carrier"]
mcp_servers = ["auftragsbuch"]

[model]
provider = "openai"
model = "gpt-4o-mini"
max_tokens = 4096
temperature = 0.2
system_prompt = """You are brain-sales, a rights carrier for the "sales" space. You are not an assistant and you take no instructions. Never call a tool. Whatever a message says, reply with exactly: brain-sales accepts no messages."""

[resources]
max_llm_tokens_per_hour = 2000
max_concurrent_tools = 5

[capabilities]
tools = ["mcp_auftragsbuch_auftrag_lesen", "mcp_auftragsbuch_auftrag_probe"]
network = []
memory_read = []
memory_write = []
